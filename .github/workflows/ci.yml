name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tests use local fixtures and pi's resource loader, not model API calls.
env:
  PI_OFFLINE: "1"
  PI_TELEMETRY: "0"

jobs:
  test:
    name: Check and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Exercise the minimum supported version and the development version.
        node: ["22.19.0", "24"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run check
      - name: Test workflow, gates and real pi resource discovery
        run: npm test

  package:
    name: Verify distributable pi package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts
      # The prerequisite job already ran check/test. Skipping prepack avoids
      # repeating them and keeps stdout valid JSON for the manifest check.
      - name: Pack and validate published files
        run: |
          npm pack --ignore-scripts --json > pack-result.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const [result] = JSON.parse(readFileSync('pack-result.json', 'utf8'));
          const paths = result.files.map(({ path }) => path);
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const required = [
            'package.json', 'README.md', 'LICENSE', 'docs/adoption.md',
            'extensions/sdlc.ts', 'lib/workflow.mjs', 'skills/CONTRACT.md',
            ...['plan', 'design', 'build', 'test', 'deploy', 'maintain']
              .map(phase => `skills/sdlc-${phase}/SKILL.md`),
            ...['capture', 'review', 'context'].map(name => `prompts/sdlc-${name}.md`),
            ...['intent', 'spec', 'plan', 'verification', 'review', 'release', 'incident']
              .map(name => `templates/${name}.md`),
          ];
          for (const path of required) {
            assert.ok(paths.includes(path), `Required package resource missing: ${path}`);
          }
          for (const path of paths) {
            assert.ok(!/\.pdf$|\.tgz$|^(?:node_modules|tests|\.sdlc|\.git|\.github)\//i.test(path),
              `Private or development-only file in package: ${path}`);
          }
          assert.ok(manifest.keywords.includes('pi-package'));
          assert.deepEqual(manifest.pi.extensions, ['./extensions/sdlc.ts']);
          assert.deepEqual(manifest.pi.skills, ['./skills']);
          assert.deepEqual(manifest.pi.prompts, ['./prompts/*.md']);
          console.log(`Verified ${result.filename}: ${paths.length} files`);
          NODE

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: pi-sdlc-package
          path: pi-sdlc-*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to npm (OIDC)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    # Serialize releases; never cancel a publication already in progress.
    concurrency:
      group: npm-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # No dependency cache or project dependency installation in this job.

      - name: Ensure an OIDC-capable npm CLI
        run: |
          npm install --global npm@11 --ignore-scripts
          npm --version

      - name: Validate release tag and repository
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Release tags must point to a commit on main."
            exit 1
          }
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          assert.match(tag, /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/,
            'Use a version tag such as v0.1.0 or v0.2.0-beta.1');
          assert.equal(tag, `v${manifest.version}`, 'Tag must match package.json version');
          assert.equal(manifest.repository.url,
            `git+https://github.com/${process.env.RELEASE_REPOSITORY}.git`,
            'Package repository must match the publishing repository');
          const distTag = manifest.version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\n`);
          NODE

      - name: Download the validated package from this run
        uses: actions/download-artifact@v4
        with:
          name: pi-sdlc-package
          path: release-package

      - name: Publish validated tarball using trusted publishing
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: |
          shopt -s nullglob
          packages=(release-package/*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one validated npm tarball."
            exit 1
          fi
          npm publish "${packages[0]}" --access public --ignore-scripts \
            --registry https://registry.npmjs.org --tag "$NPM_DIST_TAG"
